<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Get Calcalou</title>
  <link rel="icon" href="/favicon.ico">
  {{ analytics }}
  <style>
    :root { color-scheme: light; --ink: #2B1A12; --cream: #FFF6EE; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--cream); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
    main { max-width: 420px; }
    h1 { font-size: 28px; margin: 12px 0 4px; }
    p { margin: 0 0 20px; }
    .stores { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 24px; }
    .stores img { display: block; height: 50px; width: auto; }
    .qr { width: 180px; height: 180px; margin: 0 auto 8px; border-radius: 12px; overflow: hidden; }
    .qr svg { display: block; width: 100%; height: 100%; }
    small { color: #6b5a50; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/img/app-icon-96.png" alt="" width="72" height="72">
    <h1>Calcalou</h1>
    <p>{{ t['hero.title1'] }} {{ t['hero.title2'] }}<br>{{ t['hero.fine'] }}</p>
    <div class="stores">
      <a data-store="ios" href="{{ links.ios }}"><img src="/assets/img/badge-app-store.svg" alt="{{ t['store.ios'] }}" width="150" height="50"></a>
      <a data-store="android" href="{{ links.android }}"><img src="/assets/img/badge-google-play-en-50.webp" alt="{{ t['store.android'] }}" width="{{ gp_w }}" height="50"></a>
    </div>
    <div class="qr" role="img" aria-label="QR code that opens this page on your phone">{{ qr }}</div>
    <small>Scan with your phone camera · <a href="/">calcalou.com</a></small>
  </main>
  <script src="/assets/landing.js" data-no-init></script>
  <script>
    (function () {
      var stores = window.CalcalouStores, nav = navigator;
      var url = stores.storeLinks({{ ct | tojson }})[stores.detectPlatform(nav.userAgent, nav.platform, nav.maxTouchPoints)];
      if (!url) return;
      var gone = false;
      var go = function () { if (!gone) { gone = true; location.replace(url); } };
      var beacon = document.querySelector('script[data-cf-beacon]');
      if (!beacon) return go();
      beacon.addEventListener('load', function () { setTimeout(go, 400); });
      beacon.addEventListener('error', go);
      setTimeout(go, 1500);
    })();
  </script>
</body>
</html>
